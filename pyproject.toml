[project]
name = "study-coach"
version = "0.1.0"
description = "An MCP server that reads Canvas and your calendar so Claude can build personalized study plans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "icalendar>=5.0",
    "recurring-ical-events>=2.2",
    # Reading course PDFs: text extraction and rendering pages as images.
    "pypdfium2>=4.30",
    "pillow>=10.0",
    # Windows has no built-in time zone database for zoneinfo to read.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
study-coach = "study_coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
